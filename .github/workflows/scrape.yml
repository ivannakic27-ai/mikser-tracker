name: scrape

# Runs on a SELF-HOSTED Windows runner (the user's own PC): Nabava.net and Harvey Norman return 403 to GitHub's
# data-centre IPs. We do not work around that; the scraper runs from the user's home connection instead.
on:
  schedule:
    # Zagreb 07:00 and 19:00. UTC offset changes with DST (winter +1, summer +2), so both UTC hours are scheduled
    # and the Python guard (--scheduled) only runs when Europe/Zagreb local hour is 7-8 or 19-20.
    - cron: "0 5,6 * * *"
    - cron: "0 17,18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "run = scrapaj odmah, init = učitaj popis praćenih modela u Supabase (jednom)"
        type: choice
        options: [run, init]
        default: run
      slot:
        description: "morning / evening / manual (evening šalje i 'Top ponuda dana')"
        type: choice
        options: [manual, evening, morning]
        default: manual

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (uses Python already installed on the PC)
        run: py -3 -m pip install -q -r scraper/requirements.txt

      - name: Init (učitaj praćene modele)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'init'
        run: py -3 -m scraper.pipeline --init

      - name: Scheduled run
        if: github.event_name == 'schedule'
        run: py -3 -m scraper.pipeline --scheduled

      - name: Manual run
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'run'
        run: py -3 -m scraper.pipeline --slot ${{ inputs.slot }}

      - name: Commit JSON snapshot (backup)
        if: always()
        run: |
          $changes = git status --porcelain data/snapshots
          if ($changes) {
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add data/snapshots
            git commit -m ("snapshot " + (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HHmm"))
            git pull --rebase
            git push
          }
