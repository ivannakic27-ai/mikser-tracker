name: build-apk
# Builds a release APK and publishes it as a GitHub Release (download it directly on the phone).
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project (not kept in repo)
        working-directory: app
        run: |
          flutter create --platforms=android --org hr.mikser --project-name mikser_tracker .
          python3 ../scripts/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Mikser tracker APK #${{ github.run_number }}
          body: "Release APK. Instalacija: preuzmi app-release.apk na mobitel, dopusti instalaciju iz nepoznatih izvora za preglednik/Datoteke i otvori datoteku."
          files: app/build/app/outputs/flutter-apk/app-release.apk
