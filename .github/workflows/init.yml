name: init-db
# One-off: loads data/tracked_models.json into Supabase. Scraping runs on the user's PC (scripts/run_local.cmd),
# because the shops return 403 to GitHub's data-centre IPs.
on:
  workflow_dispatch:
jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -m scraper.pipeline --init
